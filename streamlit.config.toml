[server]
headless = true
port = 8501
maxUploadSize = 200
maxMessageSize = 200

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#A63A2B"
backgroundColor = "#F6F0E4"
secondaryBackgroundColor = "#EDE3CD"
textColor = "#3E362E"
font = "serif"

# 隐藏主题切换等工具栏，保持宣纸·水墨的纸面观感不被深色模式破坏
[client]
toolbarMode = "minimal"
